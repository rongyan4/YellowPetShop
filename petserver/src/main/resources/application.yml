logging:
  level:
    root: INFO  # 冒号后必须有空格，缩进比 logging 多 2 个空格
    com.yellow: debug
  file:
    name: ./app.log  # 日志文件路径
# 应用配置
spring:
  application:
    name: petserver
  #SpringAI 配置
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}

  # 数据源配置（支持环境变量覆盖）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_shop?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # MyBatis-Plus 配置
  mybatis-plus:
    type-aliases-package: com.yellow.petshop.model
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: AUTO

  # 静态资源配置
  web:
    resources:
      static-locations: file:c:/Users/rongyan/Desktop/ks/YellowPetShop/images/
  mvc:
    static-path-pattern: /api/images/**

# 服务器配置
server:
  port: 3000
  address: 0.0.0.0

# Swagger 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.yellow.petshop.controller

# OpenAPI 配置
openapi:
  info:
    title: 宠物商城API文档
    description: 宠物商城后端接口文档
    version: 1.0.0
    contact:
      name: rongyan
      email: 2603726252@qq.com

#jwt 密钥
jwt:
  secret: ${JWT_SECRET}

# 文件上传配置
file:
  upload:
    # 文件上传根目录
    base-dir: ${FILE_UPLOAD_BASE_DIR:c:/Users/rongyan/Desktop/ks/YellowPetShop/images}
    # 文件访问路径前缀（后端映射路径）
    url-prefix: ${FILE_URL_PREFIX:/api/images}


