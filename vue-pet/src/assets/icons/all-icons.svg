<!--
  =====================================================
  项目 SVG 图标汇总文件
  YellowPetShop / vue-pet
  =====================================================
  使用方式（SVG Sprite）：
    在 HTML 中引入本文件后，通过 <use> 标签引用：
    <svg><use href="#icon-paw" /></svg>

  图标列表：
    1.  icon-paw              —— 爪子Logo（网站favicon）
    2.  icon-logo-layers      —— 商家侧边栏 Logo
    3.  icon-logout           —— 退出登录
    4.  icon-nav-dashboard    —— 导航：数据概览（首页/房子）
    5.  icon-nav-goods        —— 导航：商品管理（立方体/包裹）
    6.  icon-nav-category     —— 导航：分类管理（四宫格）
    7.  icon-nav-member       —— 导航：会员管理（多人）
    8.  icon-nav-order        —— 导航：订单管理（三栏布局）
    9.  icon-stat-goods       —— 数据卡：商品总数
    10. icon-stat-order-today —— 数据卡：今日订单（折线）
    11. icon-stat-order-total —— 数据卡：订单总数（三栏）
    12. icon-stat-comment     —— 数据卡：评论总数（用户）
    13. icon-clock            —— 待支付订单（时钟）
    14. icon-package          —— 待发货订单（包裹）
    15. icon-chat             —— 待回复评论（气泡）
    16. icon-check            —— 功能列表勾选（对勾）
    17. icon-back             —— 返回按钮（左箭头）
    18. icon-edit             —— 编辑按钮（铅笔）
    19. icon-wallet           —— 钱包/余额（信用卡）
    20. icon-add              —— 添加/新增（加号）
    21. icon-search           —— 搜索（放大镜）
  =====================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- ================================================
    1. icon-paw
    来源：vue-pet/public/paw.svg
    用途：网站 favicon / 品牌标识
  ================================================ -->
  <symbol id="icon-paw" viewBox="0 0 64 64">
    <path fill="#FF9800" d="
      M20 15c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z
      m24 0c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z
      M12 30c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z
      m40 0c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z
      M32 35c-8.8 0-16 7.2-16 16 0 1.1.9 2 2 2h28c1.1 0 2-.9 2-2 0-8.8-7.2-16-16-16z
    "/>
  </symbol>

  <!-- ================================================
    2. icon-logo-layers
    来源：MerchantLayout.vue — 侧边栏顶部 Logo
    用途：商家管理系统品牌标识
  ================================================ -->
  <symbol id="icon-logo-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
    <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
  </symbol>

  <!-- ================================================
    3. icon-logout
    来源：MerchantLayout.vue — 侧边栏底部退出登录按钮
    用途：退出登录操作
  ================================================ -->
  <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
    <polyline points="16 17 21 12 16 7"/>
    <line x1="21" y1="12" x2="9" y2="12"/>
  </symbol>

  <!-- ================================================
    4. icon-nav-dashboard
    来源：MerchantLayout.vue — 侧边栏导航菜单「数据概览」
    用途：数据概览菜单项图标（房子形状）
  ================================================ -->
  <symbol id="icon-nav-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"/>
  </symbol>

  <!-- ================================================
    5. icon-nav-goods
    来源：MerchantLayout.vue — 侧边栏导航菜单「商品管理」
              Dashboard.vue — 数据卡「商品总数」图标
              Dashboard.vue — 待处理「待发货订单」图标
    用途：商品/包裹相关场景（六边形立方体）
  ================================================ -->
  <symbol id="icon-nav-goods" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
    <path d="M3.27 6.96L12 12.01l8.73-5.05 M12 22.08V12"/>
  </symbol>

  <!-- ================================================
    6. icon-nav-category
    来源：MerchantLayout.vue — 侧边栏导航菜单「分类管理」
    用途：分类管理菜单项图标（四宫格）
  ================================================ -->
  <symbol id="icon-nav-category" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M4 4h7v7H4V4z M13 4h7v7h-7V4z M4 13h7v7H4v-7z M13 13h7v7h-7v-7z"/>
  </symbol>

  <!-- ================================================
    7. icon-nav-member
    来源：MerchantLayout.vue — 侧边栏导航菜单「会员管理」
              Dashboard.vue — 数据卡「评论总数」图标
    用途：用户/会员相关场景（多人轮廓）
  ================================================ -->
  <symbol id="icon-nav-member" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    <path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
  </symbol>

  <!-- ================================================
    8. icon-nav-order
    来源：MerchantLayout.vue — 侧边栏导航菜单「订单管理」
              Dashboard.vue — 数据卡「订单总数」图标
    用途：订单/列表相关场景（三栏布局）
  ================================================ -->
  <symbol id="icon-nav-order" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M9 11H3v10h6V11z M21 11h-6v10h6V11z M15 3H9v6h6V3z"/>
  </symbol>

  <!-- ================================================
    9. icon-stat-order-today
    来源：Dashboard.vue — 数据卡「今日订单」
    用途：折线/活跃度统计图标
  ================================================ -->
  <symbol id="icon-stat-order-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  </symbol>

  <!-- ================================================
    10. icon-clock
    来源：Dashboard.vue — 待处理「待支付订单」
    用途：时间/等待状态提示
  ================================================ -->
  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  </symbol>

  <!-- ================================================
    11. icon-chat
    来源：Dashboard.vue — 待处理「待回复评论」
    用途：评论/消息气泡
  ================================================ -->
  <symbol id="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </symbol>

  <!-- ================================================
    12. icon-check
    来源：Dashboard.vue — 欢迎页功能列表勾选项
    用途：完成/选中/功能列表项标记
  ================================================ -->
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="20 6 9 17 4 12"/>
  </symbol>

  <!-- ================================================
    13. icon-back
    来源：MemberDetail.vue — 页面顶部「返回」按钮
    用途：返回上一页导航
  ================================================ -->
  <symbol id="icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </symbol>

  <!-- ================================================
    14. icon-edit
    来源：MemberDetail.vue — 「编辑基本信息」按钮
    用途：编辑/修改操作入口
  ================================================ -->
  <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </symbol>

  <!-- ================================================
    15. icon-wallet
    来源：MemberDetail.vue — 「调整余额」钱包卡片按钮
    用途：钱包/支付/余额相关操作
  ================================================ -->
  <symbol id="icon-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
    <line x1="1" y1="10" x2="23" y2="10"/>
  </symbol>

  <!-- ================================================
    16. icon-add
    来源：MemberDetail.vue — 「添加地址」按钮
              GoodsManagement.vue — 「添加商品」按钮
    用途：新增/添加操作（加号）
  ================================================ -->
  <symbol id="icon-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>

  <!-- ================================================
    17. icon-search
    来源：GoodsManagement.vue — 商品搜索框前缀图标
              OrderManagement.vue — 订单搜索框前缀图标
    用途：搜索输入框装饰图标
  ================================================ -->
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.35-4.35"/>
  </symbol>

</svg>
