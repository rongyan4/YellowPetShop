<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试订单 API</title>
</head>
<body>
    <h1>测试订单 API</h1>
    <button onclick="testCreateOrder()">测试创建订单</button>
    <pre id="result"></pre>

    <script>
        async function testCreateOrder() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = '正在发送请求...';

            const token = localStorage.getItem('token');
            if (!token) {
                resultEl.textContent = '错误：未找到 token，请先登录';
                return;
            }

            const orderData = {
                receiverName: 'rongyan',
                receiverPhone: '18026365451',
                receiverAddress: '黑龙江省 哈尔滨市 道里区 123',
                remark: '',
                items: [
                    {
                        commodityId: 25,
                        quantity: 1,
                        cartItemId: 25
                    }
                ]
            };

            try {
                const response = await fetch('http://localhost:3000/api/order/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Cache-Control': 'no-cache'
                    },
                    body: JSON.stringify(orderData)
                });

                const data = await response.json();
                
                resultEl.textContent = `
状态码: ${response.status}
响应头: ${JSON.stringify([...response.headers.entries()], null, 2)}

响应数据:
${JSON.stringify(data, null, 2)}
                `;
            } catch (error) {
                resultEl.textContent = `错误: ${error.message}\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
